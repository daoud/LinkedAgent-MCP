[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "linkedin-mcp-pipeline"
version = "0.1.0"
description = "LinkedIn Auto-Publisher Pipeline — LangGraph + FastAPI + PostgreSQL"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ---- Ruff ----

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ---- Black ----

[tool.black]
line-length = 100
target-version = ["py312"]

# ---- Mypy ----

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# ---- Pytest ----

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env = [
    "ENVIRONMENT=test",
    "DATABASE_URL=postgresql://pipeline:pipeline@localhost:5433/pipeline",
    "STORAGE_MODE=local",
    "TIMEZONE=UTC",
    "POST_SLOTS=09:00,13:00,18:00",
    "ANTHROPIC_API_KEY=test-key",
    "LLM_MODEL=claude-haiku-4-5",
    "LLM_MONTHLY_BUDGET=1.00",
    "DAILY_POST_LIMIT=3",
    "APPROVAL_TIMEOUT_H=24",
    "LOG_LEVEL=WARNING",
]
