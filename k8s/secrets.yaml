# NOTE: Do NOT commit real secrets. Populate via:
#   kubectl create secret generic linkedin-pipeline-secrets \
#     --from-literal=ANTHROPIC_API_KEY=<value> \
#     --from-literal=DATABASE_URL=<value> \
#     ... --namespace linkedin-pipeline
#
# Or use an external secrets operator (e.g. External Secrets + AWS Secrets Manager).
apiVersion: v1
kind: Secret
metadata:
  name: linkedin-pipeline-secrets
  namespace: linkedin-pipeline
  labels:
    app.kubernetes.io/name: linkedin-pipeline
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  DATABASE_URL: "postgresql://pipeline:REPLACE_ME@postgres-service:5432/pipeline"
  LINKEDIN_CLIENT_ID: "REPLACE_ME"
  LINKEDIN_CLIENT_SECRET: "REPLACE_ME"
  LINKEDIN_ACCESS_TOKEN: "REPLACE_ME"
  LINKEDIN_REFRESH_TOKEN: "REPLACE_ME"
  LINKEDIN_PROFILE_URN: "REPLACE_ME"
  GOOGLE_SHEET_ID: "REPLACE_ME"
  SLACK_WEBHOOK_URL: "REPLACE_ME"
  API_KEY: "REPLACE_ME"
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  AWS_S3_BUCKET: "REPLACE_ME"
