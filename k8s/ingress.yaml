apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkedin-pipeline
  namespace: linkedin-pipeline
  labels:
    app.kubernetes.io/name: linkedin-pipeline
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: linkedin-pipeline.example.com   # replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linkedin-pipeline
                port:
                  number: 80
  tls:
    - hosts:
        - linkedin-pipeline.example.com
      secretName: linkedin-pipeline-tls
